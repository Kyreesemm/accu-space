[package]
name = "disk-analyzer"
version = "0.1.0"
edition = "2024"
description = "Cross-platform disk usage analysis library and command-line runner"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.13"
rfd = "0.15"

[lib]
name = "disk_analyzer"
path = "src/lib.rs"

[[bin]]
name = "disk-analyzer"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
slint-build = "1.13"
