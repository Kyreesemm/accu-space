[package]
name = "accu-space"
version = "0.2.0"
edition = "2024"
authors = ["KRM Tech Software"]
description = "Accu Space - Cross-platform disk analysis and cleanup application by KRM Tech Software"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.13"
rfd = "0.15"

[lib]
name = "disk_analyzer"
path = "src/lib.rs"

[[bin]]
name = "accu-space"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
slint-build = "1.13"
